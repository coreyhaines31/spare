included:
  - Sources
  - Tests
only_rules:
  - force_cast
  - force_try
  - trailing_whitespace
  - trailing_newline
  - unused_closure_parameter
  - unused_optional_binding
  - duplicate_imports
  - empty_count
  - empty_enum_arguments
  - return_arrow_whitespace
  - opening_brace
  - closing_brace
  - comma
  - colon
